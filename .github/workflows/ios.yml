# Phase-0 CI: prove the toolchain on a cloud Mac, then package a smoke-test IPA.
# Job 1 (spike-engine-ios) is EXPECTED to need iteration — FFmpeg/libxmp for
# iOS are the known unknowns. Logs are the deliverable until it goes green.
# Job 2 builds the ObjC shell + SDL so touch/layout work can start on-device.
name: ios-port

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GO_VERSION: "1.27.0"
  ENGINE_REPO: https://github.com/ZEENEE-MASTER/svc-engine-ios.git
  ENGINE_REF: ios-port
  MIN_IOS: "17.0"
  BUNDLE_ID: com.zeenee.svc-s1

jobs:
  spike-engine-ios:
    name: Spike — Go engine for iOS (GOOS=ios, gles2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine fork
        run: git clone --depth 1 --branch "$ENGINE_REF" "$ENGINE_REPO" engine
      - name: Apply iOS port (idempotent check)
        run: |
          python3 "$GITHUB_WORKSPACE/engine-ios/apply-ios-port.py" engine "$GITHUB_WORKSPACE/engine-ios/util_ios.go"
          git -C engine diff --stat
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Xcode version
        run: xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
      - name: gomobile init
        working-directory: engine
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Compile check — engine for iOS arm64 (gles2 path)
        working-directory: engine
        run: |
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1 GOEXPERIMENT=arenas
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="${CC}++"
          export CGO_CFLAGS="-isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=${MIN_IOS} -arch arm64"
          export CGO_LDFLAGS="$CGO_CFLAGS"
          go build -tags=gles2 -o /tmp/svc-engine-check.a ./src 2>&1 | tee /tmp/ios-spike.log
          echo "--- SPIKE LOG (tail) ---"; tail -50 /tmp/ios-spike.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-spike-log
          path: /tmp/ios-spike.log

  shell-ipa:
    name: Wrapper shell IPA (unsigned, smoke test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SDL2 xcframework (2.32.10, sha-pinned)
        run: |
          set -e
          mkdir -p ios-wrapper/third-party
          curl -sL -o /tmp/SDL2.dmg https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.dmg
          echo "4a7ac31640d70214e848f994be8a12849c0f97918a7e6c2e27a40036166d1a7f  /tmp/SDL2.dmg" | shasum -a 256 -c -
          hdiutil attach /tmp/SDL2.dmg -nobrowse -quiet
          VOL="$(ls -d /Volumes/SDL2* | head -1)"
          echo "mounted: $VOL"; ls "$VOL"
          if [ -d "$VOL/SDL2.xcframework" ]; then
            cp -R "$VOL/SDL2.xcframework" ios-wrapper/third-party/
          else
            echo "no xcframework in dmg; building from source tag"
            git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git sdl
            xcodebuild -project sdl/Xcode/SDL/SDL.xcodeproj -target xcFramework-iOS -configuration Release
            XCF="$(find sdl -name 'SDL2.xcframework' -maxdepth 5 | head -1)"
            test -n "$XCF"
            cp -R "$XCF" ios-wrapper/third-party/
          fi
          hdiutil detach "$VOL" -quiet || true
          ls ios-wrapper/third-party/
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios-wrapper && xcodegen generate
      - name: Build unsigned app
        run: |
          cd ios-wrapper
          xcodebuild -project SVC_S1.xcodeproj -scheme SVC_S1 -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          cd ios-wrapper
          mkdir -p Payload && cp -R "build/Build/Products/Release-iphoneos/SVC_S1.app" Payload/
          zip -r S1-shell-unsigned.ipa Payload
          shasum -a 256 S1-shell-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: S1-shell-unsigned-ipa
          path: ios-wrapper/S1-shell-unsigned.ipa
