# iOS port CI: engine static archive + full game IPA (unsigned, sideload).
# All shells: set -euo pipefail (a masked cgo/pkg-config failure cost us a cycle).
name: ios-port

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GO_VERSION: "1.27.0"
  ENGINE_REPO: https://github.com/ZEENEE-MASTER/svc-engine-ios.git
  ENGINE_REF: ios-port
  MIN_IOS: "17.0"
  BUNDLE_ID: com.zeenee.svc-s1
  PAYLOAD_TAG: s1-payload

jobs:
  engine-archive:
    name: Engine static archive (GOOS=ios, GLES2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine fork
        run: git clone --depth 1 --branch "$ENGINE_REF" "$ENGINE_REPO" engine
      - name: Apply iOS port (idempotent check)
        run: |
          python3 "$GITHUB_WORKSPACE/engine-ios/apply-ios-port.py" engine "$GITHUB_WORKSPACE/engine-ios/util_ios.go"
          git -C engine diff --stat
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: SDL2 headers (for cgo compile)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git sdl
          xcodebuild -project sdl/Xcode/SDL/SDL.xcodeproj -target xcFramework-iOS -configuration Release
          XCF="$(find sdl -name 'SDL2.xcframework' -maxdepth 5 | head -1)"
          test -n "$XCF"
          ls "$XCF"
          # Prefer the device slice; absolute path (archive step runs in engine/).
          HDR_CAND="$(find "$XCF" -name SDL_config.h -path '*ios-arm64/*' | head -1)"
          HDR="${HDR_CAND:-$(find "$XCF" -name SDL_config.h | head -1)}"
          test -n "$HDR"
          HDR_DIR="$(dirname "$HDR")"
          echo "XCF_HEADERS=$GITHUB_WORKSPACE/$HDR_DIR" >> "$GITHUB_ENV"
          ls "$HDR_DIR/SDL.h" "$HDR_DIR/SDL_config.h"
      - name: Native deps (libvpx + FFmpeg + libxmp, static)
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/engine-ios/deps-ios.sh" \
            "$GITHUB_WORKSPACE/ios-deps" "$GITHUB_WORKSPACE/dep-src" "$XCF_HEADERS"
      - name: Archive — engine for iOS arm64
        working-directory: engine
        run: |
          set -euo pipefail
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1 GOEXPERIMENT=arenas
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="${CC}++"
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ios-deps/lib/pkgconfig"
          export CGO_CFLAGS="-isysroot $SDKROOT -miphoneos-version-min=${MIN_IOS} -arch arm64 -I$GITHUB_WORKSPACE/ios-deps/include -I$GITHUB_WORKSPACE/ios-deps/include/SDL2 -I$XCF_HEADERS"
          export CGO_LDFLAGS="-isysroot $SDKROOT -miphoneos-version-min=${MIN_IOS} -arch arm64 -L$GITHUB_WORKSPACE/ios-deps/lib"
          go mod download
          go build -buildmode=c-archive -trimpath \
            -ldflags "-X 'main.Version=ios-${GITHUB_RUN_NUMBER}' -X 'main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o "$GITHUB_WORKSPACE/libsvcengine.a" ./src 2>&1 | tee /tmp/ios-archive.log
          ls -la "$GITHUB_WORKSPACE/libsvcengine.a"
          echo "--- exports ---"
          xcrun --sdk iphoneos nm -g "$GITHUB_WORKSPACE/libsvcengine.a" 2>/dev/null | grep -E "SDL_main|SVCSetBaseDir" | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-archive-log
          path: /tmp/ios-archive.log
      - uses: actions/upload-artifact@v4
        with:
          name: libsvcengine
          path: |
            libsvcengine.a
            libsvcengine.h
      - uses: actions/upload-artifact@v4
        with:
          name: ios-deps
          path: ios-deps

  game-ipa:
    name: Game IPA (unsigned, sideload)
    runs-on: macos-15
    needs: engine-archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libsvcengine
          path: ios-wrapper/third-party
      - uses: actions/download-artifact@v4
        with:
          name: ios-deps
          path: ios-deps
      - name: SDL2 xcframework (2.32.10, sha-pinned)
        run: |
          set -euo pipefail
          mkdir -p ios-wrapper/third-party
          curl -sL -o /tmp/SDL2.dmg https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.dmg
          echo "4a7ac31640d70214e848f994be8a12849c0f97918a7e6c2e27a40036166d1a7f  /tmp/SDL2.dmg" | shasum -a 256 -c -
          hdiutil attach /tmp/SDL2.dmg -nobrowse -quiet
          VOL="$(ls -d /Volumes/SDL2* | head -1)"
          if [ -d "$VOL/SDL2.xcframework" ]; then
            cp -R "$VOL/SDL2.xcframework" ios-wrapper/third-party/
          else
            echo "no xcframework in dmg; building from source tag"
            git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git sdl
            xcodebuild -project sdl/Xcode/SDL/SDL.xcodeproj -target xcFramework-iOS -configuration Release
            XCF="$(find sdl -name 'SDL2.xcframework' -maxdepth 5 | head -1)"
            test -n "$XCF"
            cp -R "$XCF" ios-wrapper/third-party/
          fi
          hdiutil detach "$VOL" -quiet || true
          ls ios-wrapper/third-party/
      - name: MoltenVK (v1.4.2, sha-pinned, static)
        run: |
          set -euo pipefail
          curl -sL -o /tmp/MoltenVK-ios.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          echo "B5D947B1660E6E9FED40B9CD2387E160AAAB9E80B775C0CEF7E14059405178C1  /tmp/MoltenVK-ios.tar" | shasum -a 256 -c -
          rm -rf /tmp/mvk && mkdir -p /tmp/mvk && tar -xf /tmp/MoltenVK-ios.tar -C /tmp/mvk
          cp /tmp/mvk/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a ios-wrapper/third-party/
          mkdir -p ios-wrapper/third-party/MoltenVK-include
          cp -R /tmp/mvk/MoltenVK/MoltenVK/include/* ios-wrapper/third-party/MoltenVK-include/
          ls ios-wrapper/third-party/
      - name: Native dep archives (from engine job)
        run: |
          set -euo pipefail
          cp ios-deps/lib/libavformat.a \
             ios-deps/lib/libavcodec.a \
             ios-deps/lib/libavutil.a \
             ios-deps/lib/libswscale.a \
             ios-deps/lib/libswresample.a \
             ios-deps/lib/libavfilter.a \
             ios-deps/lib/libvpx.a \
             ios-deps/lib/libxmp.a \
             ios-wrapper/third-party/
          ls ios-wrapper/third-party/
      - name: Payload (S1 Lite, release asset)
        run: |
          set -euo pipefail
          mkdir -p ios-wrapper/SVCiOS/Resources
          gh release download "$PAYLOAD_TAG" -p 'payload-lite.zip' \
            -D ios-wrapper/SVCiOS/Resources --repo "$GITHUB_REPOSITORY"
          ls -la ios-wrapper/SVCiOS/Resources/
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stamp build number (stale-build detection on device)
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" ios-wrapper/SVCiOS/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios-wrapper/SVCiOS/Info.plist
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios-wrapper && xcodegen generate
      - name: Build unsigned app
        run: |
          set -euo pipefail
          cd ios-wrapper
          xcodebuild -project SVC_S1.xcodeproj -scheme SVC_S1 -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Package game IPA (+ slim without payload)
        run: |
          set -euo pipefail
          cd ios-wrapper
          rm -rf Payload && mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/SVC_S1.app" Payload/
          zip -r S1-game-unsigned.ipa Payload
          shasum -a 256 S1-game-unsigned.ipa
          rm -rf SlimPayload && mkdir -p SlimPayload/Payload
          cp -R "build/Build/Products/Release-iphoneos/SVC_S1.app" SlimPayload/Payload/
          rm -f SlimPayload/Payload/SVC_S1.app/payload-lite.zip
          (cd SlimPayload && zip -r ../S1-game-slim-unsigned.ipa Payload)
          shasum -a 256 S1-game-slim-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: S1-game-unsigned-ipa
          path: ios-wrapper/S1-game-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: S1-game-slim-unsigned-ipa
          path: ios-wrapper/S1-game-slim-unsigned.ipa
