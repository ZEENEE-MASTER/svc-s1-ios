# xcodegen spec — CI installs xcodegen and generates SVC_S1.xcodeproj.
# No storyboards/XIBs/asset catalogs: UI is programmatic, resources raw.
name: SVC_S1
options:
  bundleIdPrefix: com.zeenee
  deploymentTarget:
    iOS: "17.0"
targets:
  SVC_S1:
    type: application
    platform: iOS
    sources:
      # Whole tree incl. vendor/miniz/*.c (compiled as plain C) and *.m.
      - path: SVCiOS
        excludes:
          - "Info.plist"
          - "vendor/miniz/VENDOR.md"
    info:
      path: SVCiOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeenee.svc-s1
        PRODUCT_NAME: SVC_S1
        INFOPLIST_FILE: SVCiOS/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/third-party/**"]
        OTHER_LDFLAGS: [
          "$(inherited)",
          "-force_load", "$(SRCROOT)/third-party/libsvcengine.a",
          "-force_load", "$(SRCROOT)/third-party/libMoltenVK.a",
          "$(SRCROOT)/third-party/libavformat.a",
          "$(SRCROOT)/third-party/libavcodec.a",
          "$(SRCROOT)/third-party/libavutil.a",
          "$(SRCROOT)/third-party/libswscale.a",
          "$(SRCROOT)/third-party/libswresample.a",
          "$(SRCROOT)/third-party/libavfilter.a",
          "$(SRCROOT)/third-party/libvpx.a",
          "$(SRCROOT)/third-party/libxmp.a",
          "-lz", "-lbz2", "-liconv", "-lc++",
          "-framework", "AVFoundation",
          "-framework", "AudioToolbox",
          "-framework", "VideoToolbox",
          "-framework", "CoreMedia",
          "-framework", "CoreVideo",
          "-framework", "Metal",
          "-framework", "MetalKit",
          "-framework", "QuartzCore",
          "-framework", "IOSurface",
          "-weak_framework", "GameController",
        ]
    dependencies:
      - framework: third-party/SDL2.xcframework
        embed: true
    resources:
      - SVCiOS/Resources
